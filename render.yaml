services:
  - type: web
    name: JULIA-mobile-relay
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --proxy-headers
    envVars:
      - key: JULIA_ENV
        value: production
      # Cloudflare/Render sobrescrevem CF-Connecting-IP/X-Forwarded-For.
      # O throttle persistente no PC não depende deste cabeçalho.
      - key: JULIA_TRUST_PROXY
        value: "1"
      - key: JULIA_USERNAME
        sync: false
      - key: JULIA_PASSWORD_HASH
        sync: false
      - key: JULIA_AGENT_TOKEN
        sync: false
      - key: JULIA_SESSION_SECRET
        generateValue: true
