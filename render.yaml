services:
  - type: web
    name: julia-mobile-relay
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --proxy-headers
    envVars:
      - key: JULIA_ENV
        value: production
      - key: JULIA_USERNAME
        sync: false
      - key: JULIA_PASSWORD_HASH
        sync: false
      - key: JULIA_AGENT_TOKEN
        sync: false
      - key: JULIA_SESSION_SECRET
        generateValue: true
