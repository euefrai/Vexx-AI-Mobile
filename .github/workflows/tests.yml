name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: pip install -r requirements.txt -r pc_companion/requirements.txt pytest httpx
      - name: Run pytest
        run: pytest -q tests
      - name: Check frontend syntax
        run: |
          node --check public/app.js
          node --check public/remote.js
          node --check public/companion-setup.js
          node --check pc_companion/web/app.js
          node --check pc_companion/web/workspace.js
          node tools/test_remote_stream.cjs
          node tools/test_remote_stream.cjs --desktop
